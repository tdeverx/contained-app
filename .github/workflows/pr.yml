name: PR

# Builds on every PR — builds, tests, and validates without any versioning or release.

on:
  pull_request:
    branches: [main, nightly, beta, stable]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Classify changes
        id: changes
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          material=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              Documentation/**|README.md|Packages/*/README.md|Packages/*/Sources/*/*.docc/**|Changes/**|CODE_OF_CONDUCT.md|.github/*.md|.github/assets/**|.github/ISSUE_TEMPLATE/**|LICENSE|NOTICE|SECURITY.md|SUPPORT.md|CODEOWNERS|.github/dependabot.yml|.gitignore|appcast.xml)
                ;;
              *)
                material=true
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD")
          echo "material=${material}" >> "$GITHUB_OUTPUT"

      - name: Repository validation
        env:
          NO_RELEASE_NOTE: ${{ (contains(github.event.pull_request.labels.*.name, 'no-release-note') || github.actor == 'dependabot[bot]') && '1' || '' }}
        run: |
          set -euo pipefail
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          ./Scripts/check.sh repo --base-ref "origin/${{ github.base_ref }}" --require-release-note

      - name: Release script fixtures
        if: steps.changes.outputs.material == 'true'
        run: ./Scripts/check.sh release

      - name: Build & test
        if: steps.changes.outputs.material == 'true'
        run: |
          set -euo pipefail
          swift build -c release
          swift test
          ./Scripts/check.sh generated

      - name: Bundle smoke validation
        if: steps.changes.outputs.material == 'true'
        run: |
          set -euo pipefail
          BUILD=$(CHANNEL=nightly ./Scripts/package.sh version build)
          SHA=$(CHANNEL=nightly ./Scripts/package.sh version sha)
          VERSION=$(CHANNEL=nightly BUILD="${BUILD}" SHA="${SHA}" ./Scripts/package.sh version version)
          CHANNEL=nightly BUILD="${BUILD}" VERSION="${VERSION}" ./Scripts/package.sh app release
          VERSION="${VERSION}" BUILD="${BUILD}" ./Scripts/package.sh smoke Contained.app
          ./Scripts/check.sh generated

      - name: Skip build notice
        if: steps.changes.outputs.material != 'true'
        run: echo "Docs/community metadata only - build and bundle checks skipped."
