name: Nightly

# Builds the latest `nightly` branch, ad-hoc signs, packages a DMG, and publishes an immutable
# versioned pre-release. The Sparkle feed (appcast.xml at this branch's repo root) is then regenerated
# for the new DMG and committed back to `nightly`. Promoted beta/stable items are kept in this feed
# too, so Nightly users can receive those builds without changing channels.
#
# No Apple Developer ID / notarization (no paid account). First launch of an unsigned build needs
# right-click ▸ Open. Only secret: SPARKLE_ED_PRIVATE_KEY (DMG still ships without it).

on:
  push:
    branches: [nightly]
    # Docs/meta-only changes don't need a build. Changelog changes do, because the changelog is
    # bundled into the app and drives GitHub/Sparkle release notes.
    paths-ignore:
      - 'Documentation/**'
      - 'README.md'
      - 'Packages/*/README.md'
      - 'Packages/*/Sources/*/*.docc/**'
      - 'Changes/**'
      - 'CODE_OF_CONDUCT.md'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/assets/**'
      - '.github/dependabot.yml'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'NOTICE'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - '.gitignore'
      - 'appcast.xml'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: macos-26        # GA, arm64 (Apple silicon) — ships Xcode 26
    timeout-minutes: 30
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7        # Node 24
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build & test
        run: |
          set -euo pipefail
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          ./Scripts/check.sh repo
          ./Scripts/check.sh release
          swift build -c release
          swift test
          ./Scripts/check.sh generated

      - name: Bundle (ad-hoc signed) + DMG
        run: |
          set -euo pipefail
          BUILD=$(CHANNEL=nightly ./Scripts/package.sh version build)
          SHA=$(CHANNEL=nightly ./Scripts/package.sh version sha)
          VERSION=$(CHANNEL=nightly BUILD="${BUILD}" SHA="${SHA}" ./Scripts/package.sh version version)
          export BUILD SHA VERSION
          {
            echo "BASE_VERSION=$(./Scripts/package.sh version base)"
            echo "BUILD=${BUILD}"
            echo "SHA=${SHA}"
            echo "VERSION=${VERSION}"
          } >> "$GITHUB_ENV"
          CHANNEL=nightly BUILD="${BUILD}" VERSION="${VERSION}" ./Scripts/package.sh app release
          VERSION="${VERSION}" BUILD="${BUILD}" ./Scripts/package.sh smoke Contained.app
          ./Scripts/check.sh generated
          mkdir -p updates
          brew install create-dmg
          ./Scripts/package.sh dmg nightly Contained.app "updates/Contained-${VERSION}.dmg"
          CHANNEL=nightly VERSION_VALUE="${VERSION}" ./Scripts/notes.sh body > updates/release-notes.md
          {
            echo "Automated build of \`nightly\` @ ${SHA}."
            echo
            cat updates/release-notes.md
            echo
            echo "⚠️ Unsigned build — first launch: right-click the app ▸ **Open** (or \`xattr -dr com.apple.quarantine /Applications/Contained.app\`)."
          } > updates/github-release-notes.md
      - name: Publish immutable nightly release
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset="Contained-${VERSION}.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            [ "$target" = "$GITHUB_SHA" ] || { echo "Release $tag belongs to $target, not $GITHUB_SHA" >&2; exit 1; }
            gh release download "$tag" --pattern "$asset" --dir updates --clobber
            gh release verify "$tag"
            gh release verify-asset "$tag" "updates/$asset"
          else
            gh release create "$tag" "updates/$asset" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nightly (${VERSION})" \
              --notes-file updates/github-release-notes.md
          fi

      - name: Update Sparkle feed (nightly branch appcast.xml)
        if: env.SPARKLE_ED_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          PREVIOUS_APPCAST="$(mktemp)"
          [ -f appcast.xml ] && cp appcast.xml "$PREVIOUS_APPCAST"
          KEYFILE="$(mktemp)"; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          BIN=".build/artifacts/sparkle/Sparkle/bin"
          [ -x "$BIN/generate_appcast" ] || BIN="$(dirname "$(find .build -type f -name generate_appcast | head -1)")"
          ED_KEY_FILE="$KEYFILE" \
            DOWNLOAD_PREFIX="https://github.com/tdeverx/contained-app/releases/download/v${VERSION}/" \
            ./Scripts/appcast.sh generate "$BIN" updates
          [ -s "$PREVIOUS_APPCAST" ] && ./Scripts/appcast.sh promote --non-nightly-only "$PREVIOUS_APPCAST" appcast.xml
          CHANNEL=nightly ./Scripts/appcast.sh validate appcast.xml
          rm -f "$KEYFILE"
          rm -f "$PREVIOUS_APPCAST"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged — nothing to commit."
          else
            git commit -m "ci: nightly appcast (${VERSION}) [skip ci]"
            git push origin HEAD:nightly
          fi

      - name: Roll current notes into beta accumulator
        run: |
          set -euo pipefail
          ./Scripts/notes.sh finalize nightly
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Changes/Current.md Changes/Beta.md
          if git diff --cached --quiet; then
            echo "release notes unchanged — nothing to commit."
          else
            git commit -m "ci: roll nightly notes (${VERSION}) [skip ci]"
            git push origin HEAD:nightly
          fi
